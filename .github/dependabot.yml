version: 2

updates:
  # ---------------------------------------------------------------------------
  # Docusaurus site dependencies
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # TypeScript 7 removed the `baseUrl` compiler option that tsconfig.json
      # still sets, so `tsc --noEmit` fails with TS5102. Unlike the library's
      # blocker this is fixable here — swap baseUrl for `"paths": {"*": ["./*"]}`
      # — but Docusaurus has not yet declared TypeScript 7 support, so the
      # upgrade is deferred rather than papered over.
      # Remove this entry when taking TypeScript 7 on deliberately. Minor and
      # patch updates within 5.x still come through.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

    groups:
      # md-to-rich is intentionally not ignored: the playground should demo the
      # current release, and CI proves the site still builds against it.
      #
      # Docusaurus core/preset/tsconfig/types are released in lockstep and are
      # pinned to exact versions here — they must move together or the build
      # breaks on mismatched internals.
      docusaurus:
        patterns:
          - "@docusaurus/*"
      # react-dom declares an exact peer on react, so split major PRs can never
      # install — each one fails npm ci against the other's old version. No
      # update-types filter: majors must travel together too.
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "@docusaurus/*"
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - minor
          - patch

  # ---------------------------------------------------------------------------
  # Actions used by deploy.yml and ci.yml
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
